[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-datlink"
version = "0.1.0"
description = "PC CLI for the ESP32-S3 Wireless DATLINK programmer"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.scripts]
datlink = "datlink_cli.cli:main"

[tool.setuptools]
packages = ["datlink_cli"]
